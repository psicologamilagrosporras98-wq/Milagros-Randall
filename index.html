<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lista de regalos | Milagros & Randall</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 16px 50px;
  background: #f5f2e9;
  color: #4d5543;
  font-family: Arial, sans-serif;
}

.contenedor {
  max-width: 650px;
  margin: auto;
}

.encabezado {
  text-align: center;
  margin-bottom: 40px;
}

h1 {
  font-family: Georgia, serif;
  font-size: 36px;
  font-weight: normal;
  margin-bottom: 10px;
  color: #59624b;
}

.nombres {
  font-family: Georgia, serif;
  font-size: 22px;
  color: #6b735e;
  margin-bottom: 6px;
}

.fecha {
  font-size: 14px;
  letter-spacing: 2px;
  color: #888;
}

.intro {
  margin-top: 25px;
  line-height: 1.6;
  color: #777;
  font-size: 15px;
}

.categoria {
  margin-top: 38px;
  margin-bottom: 15px;
  padding-bottom: 8px;
  border-bottom: 1px solid #c9c7bb;
  font-family: Georgia, serif;
  font-size: 23px;
  font-weight: normal;
  color: #59624b;
}

.regalo {
  background: #fff;
  margin: 10px 0;
  padding: 15px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 9px rgba(0,0,0,0.06);
  transition: 0.2s;
}

.regalo:hover {
  transform: translateY(-1px);
}

.regalo input {
  width: 19px;
  height: 19px;
  accent-color: #687354;
}

.nombre-regalo {
  flex: 1;
  font-size: 15px;
  color: #4d4d4d;
}

button {
  border: none;
  background: #687354;
  color: white;
  padding: 9px 13px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}

button:hover {
  background: #566044;
}

.reservado .nombre-regalo {
  text-decoration: line-through;
  color: #999;
}

.reservado button {
  background: #e4e4df;
  color: #777;
  cursor: default;
}

.estado {
  display: none;
  font-size: 12px;
  color: #687354;
  font-weight: bold;
}

.reservado .estado {
  display: inline;
}

.cuentas {
  background: #fff;
  margin-top: 15px;
  padding: 20px;
  border-radius: 9px;
  box-shadow: 0 2px 9px rgba(0,0,0,0.06);
  line-height: 1.7;
  font-size: 14px;
  color: #555;
}

.cuentas-mensaje {
  text-align: center;
  line-height: 1.7;
  margin-bottom: 25px;
  color: #777;
  font-size: 14px;
}

.cuenta-banco {
  margin-bottom: 25px;
  padding-bottom: 20px;
  border-bottom: 1px solid #e5e3da;
}

.cuenta-banco:last-child {
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: none;
}

.cuenta-banco strong {
  color: #59624b;
  font-family: Georgia, serif;
  font-size: 18px;
}

.dato-cuenta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 8px;
  padding: 8px 10px;
  background: #f7f6f0;
  border-radius: 6px;
}

.dato-cuenta span {
  word-break: break-all;
  font-size: 13px;
}

.btn-copiar {
  flex-shrink: 0;
  padding: 6px 9px;
  font-size: 11px;
  background: #687354;
}

.btn-copiar.copiado {
  background: #899477;
}

.nota {
  margin-top: 40px;
  text-align: center;
  font-size: 13px;
  line-height: 1.6;
  color: #888;
}

@media (max-width: 500px) {

  body {
    padding: 25px 12px 40px;
  }

  h1 {
    font-size: 30px;
  }

  .categoria {
    font-size: 21px;
  }

  .regalo {
    padding: 13px;
  }

  .regalo button {
    padding: 8px 10px;
    font-size: 12px;
  }

  .nombre-regalo {
    font-size: 14px;
  }

  .dato-cuenta {
    align-items: center;
